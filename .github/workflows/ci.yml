name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install production dependencies (candidate Cloud path)
        run: |
          pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: pip check

      - name: Verify CPU-only PyTorch (no CUDA, no NVIDIA packages)
        run: |
          python -c "import torch; assert torch.version.cuda is None, f'CUDA available: {torch.version.cuda}'"
          echo "CPU-only PyTorch confirmed: $(python -c 'import torch; print(torch.__version__)')"
          pip list 2>/dev/null | grep -i nvidia && { echo "ERROR: NVIDIA packages found"; exit 1; } || echo "No NVIDIA/CUDA runtime packages installed"

      - name: Compile-check all executable files
        run: |
          python -m compileall app.py pages/ src/ scripts/ tests/ -q

      - name: Lint with flake8 (all executable paths)
        run: |
          flake8 app.py pages/ src/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py pages/ src/ scripts/ tests/ --count --exit-zero --max-complexity=10 --statistics

      - name: MCP static verification (no D-drive, no network, no credentials)
        run: |
          python scripts/verify_mcp_static.py

      - name: Run unit tests with coverage (offline mode)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest tests/ -v \
            --cov=src.schemas --cov=src.forecasting --cov=src.benchmarking --cov=pages \
            --cov=src.data_ingestion --cov=src.evidence_schemas \
            --cov-report=term-missing --cov-fail-under=80

      - name: Verify evidence manifest hashes
        run: |
          python -c "
import json, hashlib, os
manifest_path = 'docs/evidence/stage0/evidence_manifest.json'
with open(manifest_path) as f:
    manifest = json.load(f)
errors = []
for key, entry in manifest.get('files', {}).items():
    fname = entry.get('filename')
    expected_sha = entry.get('sha256')
    if fname and expected_sha:
        fpath = os.path.join('docs/evidence/stage0', fname)
        if not os.path.exists(fpath):
            errors.append(f'{key}: file not found: {fpath}')
            continue
        h = hashlib.sha256()
        with open(fpath, 'rb') as f:
            for chunk in iter(lambda: f.read(65536), b''):
                h.update(chunk)
        actual_sha = h.hexdigest()
        if actual_sha != expected_sha:
            errors.append(f'{key}: SHA-256 mismatch for {fname}')
            errors.append(f'  expected: {expected_sha}')
            errors.append(f'  actual:   {actual_sha}')
if errors:
    for e in errors:
        print(f'ERROR: {e}')
    exit(1)
print('All evidence manifest hashes verified.')
"
