name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install production dependencies (Cloud-identical path)
        env:
          PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"
        run: |
          pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: pip check

      - name: Verify CPU-only PyTorch
        run: |
          python -c "import torch; assert torch.version.cuda is None, f'CUDA available: {torch.version.cuda}'"
          echo "CPU-only PyTorch confirmed: $(python -c 'import torch; print(torch.__version__)')"

      - name: Compile-check all executable files
        run: |
          python -m compileall app.py pages/ src/ scripts/ tests/ -q

      - name: Lint with flake8 (all executable paths)
        run: |
          flake8 app.py pages/ src/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py pages/ src/ scripts/ tests/ --count --exit-zero --max-complexity=10 --statistics

      - name: Run unit tests with coverage (offline mode)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest tests/ -v --cov=src.schemas --cov=src.forecasting --cov=src.benchmarking --cov=pages \
            --cov-report=term-missing --cov-fail-under=80
