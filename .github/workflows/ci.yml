name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install production dependencies (candidate Cloud path)
        run: |
          pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: pip check

      - name: Verify CPU-only PyTorch (no CUDA, no NVIDIA packages)
        run: |
          python -c "import torch; assert torch.version.cuda is None, f'CUDA available: {torch.version.cuda}'"
          echo "CPU-only PyTorch confirmed: $(python -c 'import torch; print(torch.__version__)')"
          pip list 2>/dev/null | grep -i nvidia && { echo "ERROR: NVIDIA packages found"; exit 1; } || echo "No NVIDIA/CUDA runtime packages installed"

      - name: Compile-check all executable files
        run: |
          python -m compileall app.py pages/ src/ scripts/ tests/ -q

      - name: Check scripts are non-empty
        run: |
          python -c "
          import os,sys
          for f in ['scripts/verify_evidence_manifest.py','scripts/build_local_stage0_bundle.py']:
            if os.path.getsize(f)==0:
              sys.exit('ERROR: '+f+' is empty')
          print('All scripts non-empty')
          "

      - name: Lint with flake8 (all executable paths)
        run: |
          flake8 app.py pages/ src/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py pages/ src/ scripts/ tests/ --count --exit-zero --max-complexity=10 --statistics

      - name: MCP static verification (no D-drive, no network, no credentials)
        run: |
          python scripts/verify_mcp_static.py

      - name: Run unit tests with coverage (offline mode)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set +e
          python -m pytest tests/ -v \
            --cov=src.schemas --cov=src.forecasting --cov=src.benchmarking \
            --cov=src.data_ingestion --cov=src.evidence_schemas --cov=src.telemetry \
            --cov=src.coordinator --cov=src.evidence_validation \
            --cov=src.storage_policy --cov=src.redaction \
            --cov=scripts.publish_evidence --cov=scripts.verify_evidence_manifest \
            --cov-report=term-missing --cov-report=xml --cov-precision=2 --cov-fail-under=82
          pytest_exit=$?
          set -e
          echo "pytest exit code: $pytest_exit"
          if [ "$pytest_exit" -ne 0 ]; then
            echo "::error::pytest exited $pytest_exit (coverage below threshold, test failure, or no tests collected) — failing the job"
            exit "$pytest_exit"
          fi

      - name: Verify coverage gate independently (fail-closed, precision-exact)
        run: |
          # WP-K: a SECOND, independent reader of the coverage data, using
          # the coverage.py CLI directly rather than trusting pytest-cov's
          # own exit-code handling for --cov-fail-under. This is the fix
          # for a real bug found in this repo: pytest-cov's fail_under gate
          # rounds the total to --cov-precision digits before comparing
          # (coverage.results.should_fail_under), so with the default
          # precision of 0 a true 81.91% coverage rounds to "82" and does
          # NOT trip the gate, even though the terminal summary's separate,
          # unrounded comparison prints a "FAIL Required test coverage of
          # 82%..." message — the job was reported as CI-green regardless.
          # --cov-precision=2 above closes that specific rounding gap;
          # this step is a second, structurally different check in case
          # any future coverage/precision default ever changes again.
          test -f .coverage || { echo "::error::.coverage data file missing — coverage step did not run or produced no data"; exit 1; }
          python -m coverage report --precision=2 --fail-under=82

      - name: Workflow-contract regression check (coverage gate must be fail-closed)
        run: |
          python -m pytest tests/test_ci_contract.py -v

      - name: Verify evidence manifest hashes
        run: |
          python scripts/verify_evidence_manifest.py

      - name: Verify Stage 0 evidence readiness (offline)
        run: |
          python scripts/verify_stage0_evidence_readiness.py
